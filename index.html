<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenCut Lawn Care</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🌱 GreenCut Lawn Care 🌱</h1>
        </header>

        <div id="product-container">
            <input type="text" id="product-name" placeholder="Service Name">

            <input type="number" id="product-price" placeholder="Service Price" min="0.01" step="0.01">

            <button id="add-product">Add Service</button>
        </div>

        <p id="error-message"></p>

        <h2>Selected Services</h2>

        <ul id="cart"></ul>

        <div class="total-container">
            <h3>Total: $<span id="total-price">0.00</span></h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
